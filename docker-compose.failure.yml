name: smf-project2-failure

services:
  gateway:
    image: smf-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "127.0.0.1:18084:8080"
    depends_on:
      - pdu-session
    environment:
      CONFIG_PATH: /app/config.yaml
      GATEWAY_PUBLIC_URL: http://localhost:18084
      GATEWAY_UPSTREAM_TIMEOUT: ${FAILURE_UPSTREAM_TIMEOUT:-3s}
      ROUTING_MODE: round_robin
      DISCOVERY_HOSTNAME: pdu-session
      DISCOVERY_PORT: "8081"
      DISCOVERY_POLL_INTERVAL: 250ms
      DISCOVERY_HEALTH_INTERVAL: ${FAILURE_PROBE_INTERVAL:-250ms}
      DISCOVERY_METRICS_INTERVAL: ${FAILURE_PROBE_INTERVAL:-250ms}
      DISCOVERY_STALE_TTL: ${FAILURE_STALE_TTL:-35s}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

  pdu-session:
    image: smf-pdu-session:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pdu-session
    expose:
      - "8081"
    environment:
      CONFIG_PATH: /app/config.yaml
      GATEWAY_PUBLIC_URL: http://localhost:18084
      PDU_INSTANCE_ID: failure-pdu-1
      PDU_PROCESSING_DELAY: ${FAILURE_PROCESSING_DELAY:-0s}
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
