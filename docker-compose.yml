services:
  gateway:
    image: smf-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - pdu-session
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  pdu-session:
    image: smf-pdu-session:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pdu-session
    expose:
      - "8081"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      replicas: 3
