name: smf-project2

services:
  client:
    profiles:
      - tools
    image: smf-test-client:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: client
    ports:
      - "127.0.0.1:18090:8090"
    depends_on:
      - gateway
    environment:
      CLIENT_ADDRESS: ":8090"
      CLIENT_GATEWAY_URL: http://gateway:8080
      CLIENT_REQUEST_TIMEOUT: 5s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s

  gateway:
    image: smf-gateway:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    ports:
      - "127.0.0.1:18090:8080"
    depends_on:
      - pdu-session
    environment:
      CONFIG_PATH: /app/config.yaml
      GATEWAY_PUBLIC_URL: http://localhost:18080
      ROUTING_MODE: round_robin
      DISCOVERY_HOSTNAME: pdu-session
      DISCOVERY_PORT: "8081"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  pdu-session:
    image: smf-pdu-session:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: pdu-session
    expose:
      - "8081"
    environment:
      CONFIG_PATH: /app/config.yaml
      GATEWAY_PUBLIC_URL: http://localhost:18080
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
